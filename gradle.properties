# Gradle JVM 配置
# v1.202: in-process 编译需要更大堆(替代独立 Kotlin daemon,避免 sandbox 文件访问限制)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# org.gradle.java.home=C\:/Program Files/Java/jdk-21.0.12 (local only, CI uses setup-java)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android 配置
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

# Kotlin 配置
kotlin.code.style=official
# v1.202: 本地环境恢复增量编译；用 useClasspathSnapshot=false 绕开 CI 沙箱的 classpath-snapshot MD5 校验问题
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=false
# v1.202: 改用 in-process 编译策略,避免 Kotlin daemon fork 后被 sandbox 杀掉(exit code -1)
# in-process 模式下 Kotlin 编译器运行在 Gradle JVM 内,不 fork 独立进程
kotlin.compiler.execution.strategy=in-process
# Kotlin 编译 daemon 内存(in-process 模式下此项被忽略,保留以备 daemon 模式回退)
kotlin.daemon.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# KSP
ksp.useKSP2=true

android.overridePathCheck=true