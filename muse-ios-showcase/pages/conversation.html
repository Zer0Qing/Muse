/* ── Agent Plan Card ───────────────────────────────────────── */
/* @anatomy
   <span class="label">执行中</span> <div class="plan-card executing"> <div class="plan-header"> <span class="plan-icon"></span> <span class="plan-title">Agent 计划</span> <span class="plan-progress">3/5</span>
*/
.plan-card { flex: 1; min-width: 0; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-4); box-shadow: var(--shadow-2); }
.plan-card.executing { border-color: var(--primary-200); background: var(--color-primary-container); }
.plan-card.completed { border-color: var(--success-200); background: var(--success-50); }
.plan-header { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
.plan-icon { width: 20px; height: 20px; border-radius: var(--radius-full); flex-shrink: 0; }
.plan-card.executing .plan-icon { background: var(--color-primary); }
.plan-card.completed .plan-icon { background: var(--color-success); }
.plan-title { font-size: var(--font-size-body-l); font-weight: var(--font-weight-semibold); flex: 1; min-width: 0; }
.plan-progress { font-size: var(--font-size-caption); color: var(--color-on-surface-variant); font-weight: var(--font-weight-medium); white-space: nowrap; }
.plan-status { font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); color: var(--color-success); white-space: nowrap; }
.timeline { list-style: none; margin: 0; padding: 0; }
.step { position: relative; padding-left: 28px; padding-bottom: var(--space-3); }
.step:last-child { padding-bottom: 0; }
.step::before { content: ""; position: absolute; left: 7px; top: 20px; bottom: 0; width: 2px; background: var(--color-border); }
.step:last-child::before { display: none; }
.step.completed::before { background: var(--success-300); }
.step-dot { position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border-radius: var(--radius-full); border: 2px solid var(--neutral-400); background: var(--color-surface); box-sizing: border-box; }
.step.completed .step-dot { border-color: var(--color-success); background: var(--color-success); }
.step.completed .step-dot::after { content: ""; position: absolute; left: 3px; top: 1px; width: 4px; height: 8px; border: solid var(--color-surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.step.active .step-dot { border-color: var(--color-primary); background: var(--color-primary); }
.step.active .step-dot::after { content: ""; position: absolute; left: 4px; top: 4px; width: 4px; height: 4px; border-radius: var(--radius-full); background: var(--color-surface); }
.step.pending .step-dot { border-color: var(--neutral-300); background: var(--color-surface); }
.step-name { font-size: var(--font-size-body-m); color: var(--color-on-surface); }
.step.completed .step-name { color: var(--color-on-surface-variant); }
.step.active .step-name { font-weight: var(--font-weight-semibold); color: var(--color-primary); }
.plan-action { display: inline-flex; align-items: center; font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); color: var(--color-primary); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--primary-200); margin-top: var(--space-3); white-space: nowrap; text-decoration: none; transition: background var(--duration-fast); }
.plan-action:hover { background: var(--color-primary-container); }

/* ── Approval Card ─────────────────────────────────────────── */
/* @anatomy
   <span class="label">低风险</span><div class="acard low" data-evidence-sample="Pending Low Risk"><div class="ahd"><svg class="aico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="shield"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg><span class="atitle">请求批准</span><span class="atool">工具调用</span>
*/
.acard{flex:1;min-width:0;border-radius:var(--radius-card);padding:var(--space-4);border:1px solid;overflow:hidden}
.acard.low{background:var(--primary-50);border-color:var(--primary-200)}
.acard.high{background:var(--danger-50);border-color:var(--danger-200)}
.acard.ok{background:var(--success-50);border-color:var(--success-200)}
.acard.no{background:var(--neutral-100);border-color:var(--neutral-200)}
.ahd{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
.aico{width:20px;height:20px;flex-shrink:0}
.atitle{font-size:var(--font-size-body-l);font-weight:var(--font-weight-semibold);white-space:nowrap}
.low .atitle{color:var(--primary)}
.high .atitle{color:var(--danger)}
.ok .atitle{color:var(--success-600)}
.no .atitle{color:var(--muted)}
.atool{font-size:var(--font-size-caption);color:var(--muted);margin-left:auto;white-space:nowrap}
.adesc{font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-2);word-break:keep-all}
.aparam{font-family:var(--font-mono);font-size:var(--font-size-label);background:var(--hairline);border-radius:var(--radius-small);padding:var(--space-2);margin-bottom:var(--space-3);white-space:pre;overflow-x:auto}
.acts{display:flex;gap:var(--space-2)}
.abtn{flex:1;min-width:var(--size-button-md);height:var(--size-button-md);border:none;border-radius:var(--radius-button);font-size:var(--font-size-body-m);font-weight:var(--font-weight-medium);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.abtn.approve{background:var(--primary);color:var(--primary-foreground)}
.abtn.approve:hover{background:var(--primary-600)}
.abtn.reject{background:transparent;border:1px solid var(--neutral-300);color:var(--fg)}
.abtn.reject:hover{border-color:var(--neutral-500)}
.ats{font-size:var(--font-size-label);color:var(--muted);margin-top:var(--space-1)}

/* ── Conversation List ─────────────────────────────────────── */

   <span class="label">默认</span>
*/

.conv-item{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;background:transparent;cursor:pointer;transition:background .15s}
.conv-item:hover{background:var(--surface-container-low)}
.conv-item.selected{background:var(--surface-container);box-shadow:var(--shadow-2)}
.conv-item.selected:hover{background:var(--surface-container-high)}
.conv-item.selected .conv-title{font-weight:650;color:var(--primary)}
.conv-avatar{width:36px;height:36px;border-radius:var(--radius-full);background:var(--primary-100);color:var(--primary-900);display:flex;align-items:center;justify-content:center;font-size:var(--font-size-label);font-weight:var(--font-weight-medium);flex-shrink:0}
.conv-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.conv-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.conv-title{font-size:var(--font-size-caption);font-weight:var(--font-weight-medium);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

            border-radius: var(--radius-pill);
            padding: 0 var(--space-3);
            margin-top: var(--space-2);
        }
        .search-bar svg {
            width: var(--size-icon-sm);
            height: var(--size-icon-sm);
            color: var(--ink-secondary);
            flex-shrink: 0;
        }
        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-family: var(--font-body);
            font-size: var(--font-size-body-m);
            color: var(--ink);
            line-height: 1;
        }
        .search-input::placeholder {
            color: var(--ink-secondary);
        }

        /* Scrollable content area */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: var(--space-4);
        }

        /* Conversation list — 16px screen padding */
        .conv-list-padded {
            padding: var(--space-2) var(--space-4);
        }

        /* Hairline dividers — inset after avatar (iOS pattern) */
        .conv-list-padded .conv-item {
            position: relative;
        }
        .conv-list-padded .conv-item:not(:last-child)::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 56px;
            right: 0;
            height: 1px;
            background: var(--hairline);
        }

        /* Avatar emotional palette variants */
        .conv-avatar.avatar-coral {
            background: var(--accent-coral);
            color: var(--accent-foreground);
        }
        .conv-avatar.avatar-lavender {
            background: var(--accent-lavender);
            color: var(--accent-foreground);
        }
        .conv-avatar.avatar-amber {
            background: var(--accent-amber);
            color: var(--accent-foreground);
        }
        .conv-avatar.avatar-sage {
            background: var(--accent-sage);
            color: var(--accent-foreground);
        }

        /* Section separator */
        .section-separator {
            padding: var(--space-5) var(--space-4) var(--space-2);
        }
        .section-label {
            font-size: var(--font-size-caption);
            color: var(--ink-secondary);
            font-weight: var(--font-weight-regular);
        }

        /* Empty state illustration — CSS-drawn circle with leaf icon */
        .empty-illustration {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-full);
            background: var(--primary-50);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .empty-illustration svg {
            width: 28px;
            height: 28px;
            color: var(--primary-300);
        }

        /* Empty CTA icon sizing */
        .empty-cta svg {
            width: var(--size-icon-sm);
            height: var(--size-icon-sm);
        }

        /* Bottom tab bar — safe area */
        .tabbar-bottom {
            flex-shrink: 0;
            height: calc(var(--size-tabbar) + env(safe-area-inset-bottom, 0px));
        }

        /* Lucide SVG sizing — ensure tab icons are 24px */
        .tab-item svg {
            width: var(--size-icon-lg);
            height: var(--size-icon-lg);
        }
    </style>
