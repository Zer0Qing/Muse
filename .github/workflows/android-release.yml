name: Android Release

# 发布构建工作流 — 触发条件:推送 v*.*.* 格式 tag 或手动触发
# 产物:3 个 ABI(arm64-v8a / armeabi-v7a / universal)的签名 release APK
# 上传:GitHub Release 附 APK + 单独 artifact 上传便于下载
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号(用于 Release 标题,无需 v 前缀)'
        required: false
        default: ''

# 取消同一分支/标签上正在运行的旧工作流,避免重复构建
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建 GitHub Release 所需权限
    strategy:
      fail-fast: false  # 单个 ABI 失败不影响其他 ABI 继续(便于排查)
      matrix:
        abi: [arm64-v8a, armeabi-v7a, universal]
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 JDK 21(v1.0.27 P0-1.2: 对齐 gradle-daemon-jvm.properties 的 toolchainVersion=21)
      #    compileOptions 仍用 Java 17(sourceCompatibility/targetCompatibility),
      #    但 Gradle daemon 需要 JDK 21 才能启动,CI 不再依赖 foojay 自动下载
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 缓存 Gradle 依赖与 wrapper(命中后构建时间可缩短 50%+)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-${{ matrix.abi }}-
            gradle-release-${{ runner.os }}-

      # 5. 授予 gradlew 执行权限(Linux runner 默认无)
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5b. 安装 Android SDK(CI 镜像默认不装)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. 解码签名 keystore(从 GitHub Secrets 读取 base64 编码的 .jks/.keystore 文件)
      #    并生成 keystore.properties(app/build.gradle.kts 中 signingConfigs.release 会读取)
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置签名 Secrets(KEYSTORE_BASE64 为空),将使用 debug keystore 回退签名"
            mkdir -p ~/.config/.android
            keytool -genkey -v \
              -keystore ~/.config/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "storeFile=$HOME/.config/.android/debug.keystore" > keystore.properties
            echo "storePassword=android" >> keystore.properties
            echo "keyAlias=androiddebugkey" >> keystore.properties
            echo "keyPassword=android" >> keystore.properties
          else
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "storeFile=$PWD/release.keystore" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
            echo "::notice::已加载正式签名 keystore"
          fi

      # 7. 从 git tag 提取版本号(如 v1.0.26 → 1.0.26),注入给 Gradle
      #    build.gradle.kts 支持 -PversionName 覆盖,避免源码版本号与已发布 APK 错位
      - name: Extract version from tag
        id: extract-version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"  # 去掉 v 前缀,如 v1.0.26 → 1.0.26
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::从 git tag 提取版本号: $TAG"

      # 8. 构建 release APK(app/build.gradle.kts 的 splits.abi 配置会同时生成 3 个 APK)
      #    每个 matrix 任务都会执行完整构建,上传步骤只取对应 ABI 的 APK
      #    -PversionName 从 git tag 注入,确保 APK 内嵌版本号与 Release 标题一致
      - name: Assemble release APK
        env:
          VERSION_NAME: ${{ steps.extract-version.outputs.version_name }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon -PversionName="$VERSION_NAME"

      # 9. 上传对应 ABI 的 APK 作为 workflow artifact(便于审查期下载)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muse-release-${{ matrix.abi }}
          path: app/build/outputs/apk/release/app-${{ matrix.abi }}-release.apk
          retention-days: 30
          if-no-files-found: error

      # 10. 失败时上传构建报告便于排查(test/lint/compile 各阶段报告都会被打包)
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ matrix.abi }}
          path: |
            app/build/reports/
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

  # v1.0.53: 移除自动发布任务 — 构建产物不再自动创建 GitHub Release。
  # 原因: 本地构建产物与 CI 产物可能存在签名/配置差异,以本地上传为准。
  # 流程: 推送 tag 触发 CI 构建(artifact 供审查) → 手动在 Releases 页创建 Release 并上传本地 APK。
