name: Android PR Check

# PR 检查工作流 — 提交 pull_request 时触发
# P3-4: 基于 merge candidate 的作用域驱动分层 Lane
# 通过 pr_check.py 分类变更文件,只运行必要的检查 Lane
# (仓库设置中需把本工作流设为 Status Check 必选项)
on:
  pull_request:
    branches:
      - main
      - master
      - develop

# 同一 PR 上的多次提交只保留最新一次的检查
concurrency:
  group: android-pr-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  # P3-4: 作用域分类 — 分析 PR 变更文件,输出各 Lane 是否需要运行
  scope-classifier:
    name: Scope Classification
    runs-on: ubuntu-latest
    outputs:
      should-run-localization: ${{ steps.classify.outputs.localization }}
      should-run-android-resources: ${{ steps.classify.outputs.android_resources }}
      should-run-android-jvm: ${{ steps.classify.outputs.android_jvm }}
      should-run-android-full: ${{ steps.classify.outputs.android_full }}
      should-run-script: ${{ steps.classify.outputs.script }}
      scopes: ${{ steps.classify.outputs.scopes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史用于 git diff
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Classify PR scope
        id: classify
        run: |
          # 获取 base 分支的完整引用
          git fetch origin ${{ github.base_ref }} --depth=1
          RESULT=$(python ci/script/pr_check.py --base origin/${{ github.base_ref }} --output json)
          echo "$RESULT"
          # 提取各 Lane 的运行状态
          LOCALIZATION=$(echo "$RESULT" | python -c "import sys,json; print(str(json.load(sys.stdin)['lanes']['localization']).lower())")
          ANDROID_RESOURCES=$(echo "$RESULT" | python -c "import sys,json; print(str(json.load(sys.stdin)['lanes']['android_resources']).lower())")
          ANDROID_JVM=$(echo "$RESULT" | python -c "import sys,json; print(str(json.load(sys.stdin)['lanes']['android_jvm']).lower())")
          ANDROID_FULL=$(echo "$RESULT" | python -c "import sys,json; print(str(json.load(sys.stdin)['lanes']['android_full']).lower())")
          SCRIPT=$(echo "$RESULT" | python -c "import sys,json; print(str(json.load(sys.stdin)['lanes']['script']).lower())")
          SCOPES=$(echo "$RESULT" | python -c "import sys,json; print(','.join(json.load(sys.stdin)['scopes']))")
          echo "localization=$LOCALIZATION" >> $GITHUB_OUTPUT
          echo "android_resources=$ANDROID_RESOURCES" >> $GITHUB_OUTPUT
          echo "android_jvm=$ANDROID_JVM" >> $GITHUB_OUTPUT
          echo "android_full=$ANDROID_FULL" >> $GITHUB_OUTPUT
          echo "script=$SCRIPT" >> $GITHUB_OUTPUT
          echo "scopes=$SCOPES" >> $GITHUB_OUTPUT

  # P3-4: 快速检查 Lane — 仓库卫生 + 工程纪律 + 本地化校验
  # 轻量级检查,不需要 JDK/Gradle,几秒内完成
  # 始终运行(无论变更了什么文件)
  quick-checks:
    name: Quick Checks (Hygiene + Discipline)
    runs-on: ubuntu-latest
    needs: scope-classifier
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # P3-4: 仓库卫生检查(冲突标记/行尾空白/语法)
      - name: Repository hygiene check
        run: python ci/script/check_repo_hygiene.py
      # P3-5: 工程纪律检查(unsafe cast/空 catch/!! 等)
      - name: Engineering discipline check
        run: python ci/script/check_engineering_discipline.py --diff --base origin/${{ github.base_ref }}
      # 设计令牌检查(ui/ 裸色 Color(0x 只降不升,baseline 豁免存量)
      - name: Design tokens check
        run: python ci/script/check_design_tokens.py

  # P3-4: 本地化校验 Lane — 仅在 values-* 资源变更时运行
  localization-check:
    name: Localization Check
    runs-on: ubuntu-latest
    needs: scope-classifier
    if: needs.scope-classifier.outputs.should-run-localization == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # P2-5: 本地化完整性校验
      - name: Localization completeness check
        run: python ci/script/check_localizations.py --res-dir app/src/main/res --verbose

  # P3-4: CI 脚本校验 Lane — 仅在 ci/ 目录文件变更时运行
  script-check:
    name: CI Script Check
    runs-on: ubuntu-latest
    needs: scope-classifier
    if: needs.scope-classifier.outputs.should-run-script == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run pr_check tests
        run: python ci/test/test_pr_check.py
      - name: Run engineering discipline tests
        run: python ci/test/test_engineering_discipline.py
      - name: Validate Python scripts syntax
        run: |
          python -m py_compile ci/script/pr_check.py
          python -m py_compile ci/script/check_repo_hygiene.py
          python -m py_compile ci/script/check_engineering_discipline.py
          python -m py_compile ci/script/check_localizations.py
          python -m py_compile ci/script/check_design_tokens.py
          echo "All CI scripts passed syntax check"

  # P3-4: Android 构建 Lane — 编译 + 单测 + 覆盖率
  # 只在 Kotlin/Java/资源/构建配置变更时运行
  check:
    name: Compile & Test
    runs-on: ubuntu-latest
    needs: [scope-classifier, quick-checks]
    if: |
      needs.scope-classifier.outputs.should-run-android-jvm == 'true' ||
      needs.scope-classifier.outputs.should-run-android-resources == 'true' ||
      needs.scope-classifier.outputs.should-run-android-full == 'true'
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Compile debug Kotlin
        run: ./gradlew compileDebugKotlin --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Generate Kover coverage report
        run: ./gradlew :koverXmlReport :koverHtmlReport --stacktrace --no-daemon

      - name: Publish unit test results to PR
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            **/build/test-results/**/*.xml
          check_name: "Unit Test Results"
          comment_title: "单元测试结果"
          comment_mode: always

      - name: Upload Kover coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-coverage-report-${{ github.event.pull_request.number }}
          path: |
            build/reports/kover/report.xml
            build/reports/kover/html/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-reports-${{ github.event.pull_request.number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # P3-4: 完整构建 Lane — 仅在构建配置/manifest 变更时运行 assemble
  # 比编译更重,确保 APK 能成功打包
  assemble:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    needs: [scope-classifier, check]
    if: needs.scope-classifier.outputs.should-run-android-full == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-debug-apk-${{ github.event.pull_request.number }}
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn
