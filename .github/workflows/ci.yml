name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        # v1.0.27 P0-1.2: 对齐 gradle-daemon-jvm.properties 的 toolchainVersion=21
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
    - name: Android Lint check
      run: ./gradlew lint
    - name: Unit tests
      run: ./gradlew test
    # Phase 2.1: 生成 Kover 聚合覆盖率报告(push 到 main 时也产出,便于追踪覆盖率趋势)
    - name: Generate Kover coverage report
      run: ./gradlew :koverXmlReport :koverHtmlReport --stacktrace --no-daemon
    - name: Build debug APK
      run: ./gradlew assembleDebug
    - name: Build release APK
      run: ./gradlew assembleRelease
    - name: APK size report
      run: |
        ls -lh app/build/outputs/apk/debug/*.apk
        ls -lh app/build/outputs/apk/release/*.apk
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Muse-debug-apk
        path: app/build/outputs/apk/debug/*.apk
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Muse-release-apk
        path: app/build/outputs/apk/release/*.apk
    # Phase 2.1: 上传 Kover 覆盖率报告 artifact
    - name: Upload Kover coverage report
      uses: actions/upload-artifact@v4
      with:
        name: Muse-coverage-report
        path: |
          build/reports/kover/report.xml
          build/reports/kover/html/
        retention-days: 14
        if-no-files-found: warn
