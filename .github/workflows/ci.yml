name: CI

# CI 只允许可复现的入口：质量门禁、单测/调试包、tag 正式构建与 Release。
# 所有 run 步骤使用 PowerShell 7，避免 Windows 本地与 CI shell 语义不一致。
defaults:
  run:
    shell: pwsh

concurrency:
  group: muse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Grant execute permission for gradlew
        run: |
          $path = (Resolve-Path './gradlew').Path
          [System.IO.File]::SetUnixFileMode(
            $path,
            [System.IO.UnixFileMode]::UserRead -bor
              [System.IO.UnixFileMode]::UserWrite -bor
              [System.IO.UnixFileMode]::UserExecute -bor
              [System.IO.UnixFileMode]::GroupRead -bor
              [System.IO.UnixFileMode]::GroupExecute -bor
              [System.IO.UnixFileMode]::OtherRead -bor
              [System.IO.UnixFileMode]::OtherExecute
          )
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: CI script tests
        run: ./ci/run_ci_checks.ps1 -Lane ci-scripts
      - name: Lane checks
        run: ./ci/run_ci_checks.ps1 -Lane lanes
      - name: Static checks
        # Detekt baseline 由本地 :module:detektBaseline 更新并提交；CI 不自动改仓库。
        # 这样新增问题会失败，历史问题仍由对应模块 baseline 明确记录。
        run: ./ci/run_ci_checks.ps1 -Lane static
      - name: Unit tests (app/memory/ai)
        run: ./ci/run_ci_checks.ps1 -Lane unit
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests
            memory/build/reports/tests
            ai/build/reports/tests
          if-no-files-found: ignore
      - name: Migration coverage check
        run: python3 ci/script/check_migration_coverage.py
      - name: Build debug APK
        run: ./ci/run_ci_checks.ps1 -Lane debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports
            build/reports/kover
          if-no-files-found: ignore

  android-test:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Grant execute permission for gradlew
        run: |
          $path = (Resolve-Path './gradlew').Path
          [System.IO.File]::SetUnixFileMode(
            $path,
            [System.IO.UnixFileMode]::UserRead -bor
              [System.IO.UnixFileMode]::UserWrite -bor
              [System.IO.UnixFileMode]::UserExecute -bor
              [System.IO.UnixFileMode]::GroupRead -bor
              [System.IO.UnixFileMode]::GroupExecute -bor
              [System.IO.UnixFileMode]::OtherRead -bor
              [System.IO.UnixFileMode]::OtherExecute
          )
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Grant execute permission for gradlew
        run: |
          $path = (Resolve-Path './gradlew').Path
          [System.IO.File]::SetUnixFileMode(
            $path,
            [System.IO.UnixFileMode]::UserRead -bor
              [System.IO.UnixFileMode]::UserWrite -bor
              [System.IO.UnixFileMode]::UserExecute -bor
              [System.IO.UnixFileMode]::GroupRead -bor
              [System.IO.UnixFileMode]::GroupExecute -bor
              [System.IO.UnixFileMode]::OtherRead -bor
              [System.IO.UnixFileMode]::OtherExecute
          )
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Resolve and validate release version
        id: version
        run: python3 ci/script/resolve_release_version.py --tag "$env:GITHUB_REF_NAME" --gradle-file app/build.gradle.kts --github-output "$env:GITHUB_OUTPUT"
      - name: Restore and validate signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 ci/script/validate_release_signing.py --keystore-out ./keystore.jks --properties-out ./keystore.properties
      - name: Build release APKs
        run: ./gradlew assembleRelease -PversionName="${{ steps.version.outputs.version_name }}" -PversionCode="${{ steps.version.outputs.version_code }}"
      - name: Generate release manifest
        run: |
          $apk = Get-ChildItem 'app/build/outputs/apk/release/*.apk' | Select-Object -First 1
          if ($null -eq $apk) { throw 'no release APK was generated' }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          python3 ci/script/generate_release_manifest.py `
            --version-name "${{ steps.version.outputs.version_name }}" `
            --version-code "${{ steps.version.outputs.version_code }}" `
            --apk "$($apk.FullName)" `
            --db-file app/src/main/java/io/zer0/muse/data/session/MuseDb.kt `
            --release-notes "releases/$env:GITHUB_REF_NAME/release_body.md" `
            --out release/manifest.json
      - name: Upload release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            release/manifest.json
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ci/script/publish_release.py `
            --tag "$env:GITHUB_REF_NAME" `
            --body-file "releases/$env:GITHUB_REF_NAME/release_body.md" `
            --artifacts 'app/build/outputs/apk/release/*.apk' `
            --artifacts 'release/manifest.json'
