name: CI

# CI 只允许可复现的入口：质量门禁、单测/调试包、tag 正式构建与 Release。
# 所有 run 步骤使用 PowerShell 7，避免 Windows 本地与 CI shell 语义不一致。
defaults:
  run:
    shell: pwsh

concurrency:
  group: muse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy `tools` SDK package was removed from current runners.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # P4-9: 消费 pr_check 的 lanes 输出 — 纯文档/其他 PR 不再触发 Android 全量构建。
      # push/tag/schedule 因无法对比 PR base,一律 full。
      - name: Compute affected lanes (PR path filtering)
        id: lanes
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys
          base = os.environ.get('GITHUB_BASE_REF')
          if base:
              out = subprocess.run(
                  ['python3', 'ci/script/pr_check.py', '--base', 'origin/' + base, '--output', 'json'],
                  capture_output=True, text=True, check=True,
              ).stdout
              scopes = set(json.loads(out).get('scopes', []))
          else:
              scopes = {'android_jvm', 'android_full', 'android_resources', 'script', 'localization', 'config'}
          heavy = bool(scopes & {'android_jvm', 'android_full', 'android_resources', 'script'})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"run_full={'true' if heavy else 'false'}\n")
              f.write('scopes=' + ','.join(sorted(scopes)) + '\n')
          print(f"affected scopes: {sorted(scopes)} run_full={heavy}")
          PYEOF
      - name: Build Web Host UI assets
        if: steps.lanes.outputs.run_full == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Grant execute permission for gradlew
        run: |
          $path = (Resolve-Path './gradlew').Path
          [System.IO.File]::SetUnixFileMode(
            $path,
            [System.IO.UnixFileMode]::UserRead -bor
              [System.IO.UnixFileMode]::UserWrite -bor
              [System.IO.UnixFileMode]::UserExecute -bor
              [System.IO.UnixFileMode]::GroupRead -bor
              [System.IO.UnixFileMode]::GroupExecute -bor
              [System.IO.UnixFileMode]::OtherRead -bor
              [System.IO.UnixFileMode]::OtherExecute
          )
      - name: Gradle cache
        if: steps.lanes.outputs.run_full == 'true'
        uses: gradle/actions/setup-gradle@v6
      - name: CI script tests
        run: ./ci/run_ci_checks.ps1 -Lane ci-scripts
      - name: Lane checks
        env:
          PR_CHECK_SCOPES: ${{ steps.lanes.outputs.scopes }}
        run: ./ci/run_ci_checks.ps1 -Lane lanes -ChangedScopes "$env:PR_CHECK_SCOPES"
      - name: Static checks
        if: steps.lanes.outputs.run_full == 'true'
        # Detekt baseline 由本地 :module:detektBaseline 更新并提交；CI 不自动改仓库。
        # 这样新增问题会失败，历史问题仍由对应模块 baseline 明确记录。
        run: ./ci/run_ci_checks.ps1 -Lane static
      - name: Unit tests (app/memory/ai)
        if: steps.lanes.outputs.run_full == 'true'
        run: ./ci/run_ci_checks.ps1 -Lane unit
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests
            memory/build/reports/tests
            ai/build/reports/tests
          if-no-files-found: ignore
      - name: Migration coverage check
        if: steps.lanes.outputs.run_full == 'true'
        run: python3 ci/script/check_migration_coverage.py
      # CMP-11 / I18N-02 护栏: 纯脚本秒级检查,无条件执行(不受 run_full 路由影响,
      # doc-only PR 也拦截)。static lane(ci/run_ci_checks.ps1)会再跑同一对脚本,
      # 保证 `run_ci_checks.ps1 -Lane static` 本地复现与 CI 一致;这里显式列出
      # 是为了 CI 页面能直接定位失败项。
      - name: Component convergence guard (CMP-11)
        run: python3 ci/script/check_component_convergence.py
      - name: Translation residue guard (I18N-02)
        run: python3 ci/script/check_translation_residue.py
      - name: Font scale clipping guard (A11Y-03)
        run: python3 ci/script/check_font_scale_clipping.py
      - name: Build debug APK
        if: steps.lanes.outputs.run_full == 'true'
        run: ./ci/run_ci_checks.ps1 -Lane debug
      - name: Upload debug APK
        if: steps.lanes.outputs.run_full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports
            build/reports/kover
          if-no-files-found: ignore

  android-test:
    # P4-3: instrumented 测试此前只在手动 workflow_dispatch 跑,nightly 从不执行。
    # 现在 schedule(与上方 nightly cron 同频)也触发 emulator smoke,手动仍可触发。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Grant execute permission for gradlew
        run: |
          $path = (Resolve-Path './gradlew').Path
          [System.IO.File]::SetUnixFileMode(
            $path,
            [System.IO.UnixFileMode]::UserRead -bor
              [System.IO.UnixFileMode]::UserWrite -bor
              [System.IO.UnixFileMode]::UserExecute -bor
              [System.IO.UnixFileMode]::GroupRead -bor
              [System.IO.UnixFileMode]::GroupExecute -bor
              [System.IO.UnixFileMode]::OtherRead -bor
              [System.IO.UnixFileMode]::OtherExecute
          )
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Web Host UI assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Grant execute permission for gradlew
        run: |
          $path = (Resolve-Path './gradlew').Path
          [System.IO.File]::SetUnixFileMode(
            $path,
            [System.IO.UnixFileMode]::UserRead -bor
              [System.IO.UnixFileMode]::UserWrite -bor
              [System.IO.UnixFileMode]::UserExecute -bor
              [System.IO.UnixFileMode]::GroupRead -bor
              [System.IO.UnixFileMode]::GroupExecute -bor
              [System.IO.UnixFileMode]::OtherRead -bor
              [System.IO.UnixFileMode]::OtherExecute
          )
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Resolve and validate release version
        id: version
        run: python3 ci/script/resolve_release_version.py --tag "$env:GITHUB_REF_NAME" --gradle-file app/build.gradle.kts --github-output "$env:GITHUB_OUTPUT"
      - name: Restore and validate signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 ci/script/validate_release_signing.py --keystore-out ./keystore.jks --properties-out ./keystore.properties
      - name: Build release APKs
        run: ./gradlew assembleRelease -PversionName="${{ steps.version.outputs.version_name }}" -PversionCode="${{ steps.version.outputs.version_code }}"
      - name: Verify release APK signatures
        run: python3 ci/script/validate_release_apks.py --apk 'app/build/outputs/apk/release/*.apk'
      - name: Generate release manifest
        run: |
          $apks = @(Get-ChildItem 'app/build/outputs/apk/release/*.apk' | Sort-Object Name)
          if ($apks.Count -eq 0) { throw 'no release APK was generated' }
          $apkArgs = @()
          foreach ($apk in $apks) { $apkArgs += @('--apk', $apk.FullName) }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          python3 ci/script/generate_release_manifest.py `
            --version-name "${{ steps.version.outputs.version_name }}" `
            --version-code "${{ steps.version.outputs.version_code }}" `
            $apkArgs `
            --db-file app/src/main/java/io/zer0/muse/data/session/MuseDb.kt `
            --release-notes "releases/$env:GITHUB_REF_NAME/release_body.md" `
            --commit-sha "$env:GITHUB_SHA" `
            --source-ref "$env:GITHUB_REF_NAME" `
            --out release/manifest.json
          python3 ci/script/validate_release_manifest.py `
            --manifest release/manifest.json `
            $apkArgs `
            --db-file app/src/main/java/io/zer0/muse/data/session/MuseDb.kt `
            --tag "$env:GITHUB_REF_NAME" `
            --commit-sha "$env:GITHUB_SHA"
      - name: Upload release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            release/manifest.json
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ci/script/publish_release.py `
            --tag "$env:GITHUB_REF_NAME" `
            --body-file "releases/$env:GITHUB_REF_NAME/release_body.md" `
            --artifacts 'app/build/outputs/apk/release/*.apk' `
            --artifacts 'release/manifest.json'

