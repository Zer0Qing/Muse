<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- S6：App 在 serve 这一页时把自身的版本与协议写在这里（HostVersionTag.kt）。
         删掉这行 = 网页端再也看不出资源和 App 是不是同一次构建的产物。 -->
    <!--MUSE_HOST_BUILD-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a7a55" />
    <meta name="description" content="Muse：持续认识你的 AI" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS: add-to-home-screen behaves like a standalone app even without a service worker -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Muse" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <title>Muse</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
