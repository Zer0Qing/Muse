server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
  location /api/ { proxy_pass http://api:8080; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 300s; }
  location / { try_files $uri $uri/ /index.html; }
  location = /sw.js { add_header Cache-Control "no-store" always; try_files $uri =404; }
}
