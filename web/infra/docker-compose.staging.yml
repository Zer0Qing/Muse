services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env.staging]
    volumes: ["muse-postgres:/var/lib/postgresql/data"]
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: [.env.staging]
    depends_on: [postgres, redis]
    ports: ["8080:8080"]
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    env_file: [.env.staging]
    depends_on: [postgres, redis]
  client:
    build:
      context: ..
      dockerfile: infra/Dockerfile.client
    restart: unless-stopped
    ports: ["8081:80"]
  admin:
    build:
      context: ..
      dockerfile: infra/Dockerfile.admin
    restart: unless-stopped
    ports: ["8082:80"]
volumes:
  muse-postgres:
