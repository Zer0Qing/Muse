<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navigation Bar</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body{margin:0;padding:12px;background:var(--color-background);font-family:var(--font-body);color:var(--color-on-surface)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.label{width:92px;flex-shrink:0;font-size:var(--font-size-label);font-weight:var(--font-weight-medium);color:var(--color-muted-foreground);text-transform:uppercase}
.divider{border:none;border-top:1px solid var(--color-border);margin:8px 0}
/* @component-css-start */
.navbar{display:flex;align-items:center;width:100%;background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturation));-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturation))}
.navbar-inline{height:var(--size-navbar);padding:0 var(--space-4)}
.navbar-large{flex-direction:column;align-items:stretch;padding:var(--space-2) var(--space-4) var(--space-3)}
.navbar-bar{display:flex;align-items:center;height:var(--size-navbar)}
.nav-title-large{font-size:var(--font-size-display-xl);font-weight:var(--font-weight-bold);line-height:var(--line-height-display);letter-spacing:-0.02em;color:var(--ink);margin:var(--space-1) 0 0;white-space:nowrap}
.nav-title-inline{font-size:17px;font-weight:var(--font-weight-semibold);color:var(--ink);flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-btn{display:inline-flex;align-items:center;justify-content:center;width:var(--size-touch-target);height:var(--size-touch-target);min-width:var(--size-touch-target);border:none;background:transparent;cursor:pointer;color:var(--accent);flex-shrink:0;transition:background var(--duration-fast)}
.nav-btn:hover{background:var(--surface-container-high)}
.nav-btn img{width:var(--size-icon-lg);height:var(--size-icon-lg)}
.nav-spacer{flex:1}
.tabbar{display:flex;width:100%;height:var(--size-tabbar);background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturation));-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturation));border-top:1px solid var(--hairline)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;cursor:pointer;color:var(--ink-secondary);text-decoration:none;transition:color var(--duration-fast)}
.tab-item:hover{color:var(--accent-foreground-muted)}
.tab-item.active{color:var(--accent)}
.tab-icon{width:var(--size-icon-lg);height:var(--size-icon-lg)}
.tab-label{font-size:var(--font-size-tab);font-weight:var(--font-weight-medium);white-space:nowrap}
/* @component-css-end */
</style>
</head>
<body>
<div class="row" data-evidence-sample="Large Title Top Nav">
<span class="label">大标题</span>
<div class="navbar navbar-large">
<div class="navbar-bar">
<button class="nav-btn" aria-label="返回"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/chevron-left.svg" alt="返回"></button>
<div class="nav-spacer"></div>
<button class="nav-btn" aria-label="更多"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/ellipsis.svg" alt="更多"></button>
</div>
<div class="nav-title-large">对话</div>
</div>
</div>
<div class="row" data-evidence-sample="Inline Top Nav">
<span class="label">内联</span>
<div class="navbar navbar-inline">
<button class="nav-btn" aria-label="返回"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/chevron-left.svg" alt="返回"></button>
<div class="nav-title-inline">记忆</div>
<button class="nav-btn" aria-label="更多"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/ellipsis.svg" alt="更多"></button>
</div>
</div>
<hr class="divider">
<div class="row" data-evidence-sample="Bottom Tab Bar">
<span class="label">标签栏</span>
<nav class="tabbar">
<a href="#" class="tab-item active">
<img class="tab-icon" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/message-circle.svg" alt="对话">
<span class="tab-label">对话</span>
</a>
<a href="#" class="tab-item">
<img class="tab-icon" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/database.svg" alt="记忆">
<span class="tab-label">记忆</span>
</a>
<a href="#" class="tab-item">
<img class="tab-icon" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/book-open.svg" alt="知识库">
<span class="tab-label">知识库</span>
</a>
<a href="#" class="tab-item">
<img class="tab-icon" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/settings.svg" alt="设置">
<span class="tab-label">设置</span>
</a>
</nav>
</div>
</body>
</html>
