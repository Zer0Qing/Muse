<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinking Card — Muse iOS</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:var(--space-3);background:var(--color-background);font-family:var(--font-family-base);color:var(--color-on-surface)}
.row{display:flex;gap:var(--space-2);align-items:center;margin-bottom:var(--space-2);flex-wrap:wrap}
.label{font-size:var(--font-size-label);font-weight:var(--font-weight-medium);color:var(--color-muted-foreground);text-transform:uppercase;letter-spacing:.02em;width:92px;flex-shrink:0}
.divider{border:none;border-top:1px solid var(--color-border);margin:var(--space-3) 0}
/* @component-css-start */
.tc{background:var(--primary-50);border-radius:var(--radius-md);padding:11px 9px;border-left:2px solid var(--primary-300);flex:1;min-width:0}
.tc--collapsed{display:inline-flex;align-items:center;gap:var(--space-2);border-left:none;flex:0 0 auto;cursor:pointer;transition:filter var(--duration-fast)}
.tc--collapsed:hover{filter:brightness(.97)}
.tc__label{font-size:var(--font-size-label);font-weight:var(--font-weight-medium);color:var(--color-muted-foreground);white-space:nowrap}
.tc__header{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-1)}
.tc__content{font-family:var(--font-mono);font-size:var(--font-size-label);color:var(--color-muted-foreground);line-height:1.5;overflow-wrap:break-word;word-break:keep-all}
.tc--stream{background:linear-gradient(90deg,var(--primary-50),var(--primary-100),var(--primary-50));background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.tc__cursor{display:inline-block;width:2px;height:14px;background:var(--primary-500);vertical-align:text-bottom;animation:blink 1s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.tc__dot{display:inline-block;width:8px;height:8px;border-radius:var(--radius-full);background:var(--success-600);flex-shrink:0}
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">折叠态</span><div class="tc tc--collapsed" data-evidence-sample="collapsed"><span class="tc__label">思考中</span></div></div>
<div class="row"><span class="label">流式态</span><div class="tc tc--stream" data-evidence-sample="streaming"><div class="tc__header"><span class="tc__label">思考中</span></div><div class="tc__content">对话<span class="tc__cursor"></span></div></div></div>
<hr class="divider">
<div class="row"><span class="label">完成态</span><div class="tc" data-evidence-sample="expanded-complete"><div class="tc__header"><span class="tc__label">工具调用</span><span class="tc__dot" aria-label="完成"></span></div><div class="tc__content">对话</div></div></div>
</body>
</html>
