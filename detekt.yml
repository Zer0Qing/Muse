# detekt 静态分析配置
build:
  maxIssues: 0

complexity:
  LongMethod:
    active: true
    threshold: 80
  LargeClass:
    active: true
    threshold: 600

style:
  MagicNumber:
    active: false
  UnusedImports:
    active: true
  TrailingWhitespace:
    active: true

potential-bugs:
  UnreachableCode:
    active: true

performance:
  CouldBeSequence:
    active: true

naming:
  active: true

exceptions:
  active: true

empty-blocks:
  active: true
