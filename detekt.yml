# detekt 静态分析配置
build:
  maxIssues: 0

complexity:
  # 阈值按「读得懂」而不是「数字小」来定。
  # 一个 Compose 内容函数天然就长：它描述的是界面结构，拆成七八个只有
  # 一处的子函数之后，读的人得反复跳转才能拼出整棵树，比长函数更难懂。
  LongMethod:
    active: true
    threshold: 120

  # 参数多的重灾区是数据类和构造函数，它们本来就是在描述「有哪些字段」。
  # 8 个以内还能靠名字记住顺序，再多就该换成具名对象了。
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10

  # 一屏放得下的分支比强行抽函数好读。超过 20 通常说明这段逻辑确实该拆了。
  CyclomaticComplexMethod:
    active: true
    threshold: 20

  ComplexCondition:
    active: true
    threshold: 6

  NestedBlockDepth:
    active: true
    threshold: 5

  # 大文件在这个项目里主要是 ViewModel 和系统提示组装，都是「一个职责、很多细节」。
  LargeClass:
    active: true
    threshold: 900

  TooManyFunctions:
    active: true
    thresholdInClasses: 18
    thresholdInInterfaces: 15
    thresholdInObjects: 18
    thresholdInFiles: 30

style:
  # 早返回是让代码变平的手段，不是坏味道。真正的问题是嵌套，
  # 而这个仓库的嵌套由 NestedBlockDepth 单独管。
  ReturnCount:
    active: true
    max: 4
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    # 与根 .editorconfig 的 max_line_length 对齐。detekt 默认 120 会把 121–140 字符
    # 的行记成另一套债务；项目明确采用 140 后，>140 的行仍由该规则真实拦截。
    maxLineLength: 140
  UnusedImports:
    active: true
  TrailingWhitespace:
    active: true

potential-bugs:
  UnreachableCode:
    active: true

performance:
  CouldBeSequence:
    active: true

naming:
  active: true
  # v2.6.7: 让 detekt 也认识 Compose 命名约定。
  #
  # 背景：根 .editorconfig 已设 `ktlint_function_naming_ignore_when_annotated_with = Composable`，
  # 但那只对 ktlint 生效 —— detekt 不读 .editorconfig 的这条键。
  # 结果就是 600 条 @Composable 函数的 PascalCase 被 FunctionNaming 判违规，
  # 长期挂在基线里当噪音（既不是真问题，又掩盖了真问题）。
  #
  # 这是补全工具链一致性，不是放宽规则：普通函数仍要求小驼峰，
  # 只有带 @Composable 注解的组合函数按 Compose 约定允许 PascalCase。
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'

exceptions:
  active: true

empty-blocks:
  active: true