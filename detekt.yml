# detekt 静态分析配置
build:
  maxIssues: 0

complexity:
  LongMethod:
    active: true
    threshold: 80
  LargeClass:
    active: true
    threshold: 600

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    # 与根 .editorconfig 的 max_line_length 对齐。detekt 默认 120 会把 121–140 字符
    # 的行记成另一套债务；项目明确采用 140 后，>140 的行仍由该规则真实拦截。
    maxLineLength: 140
  UnusedImports:
    active: true
  TrailingWhitespace:
    active: true

potential-bugs:
  UnreachableCode:
    active: true

performance:
  CouldBeSequence:
    active: true

naming:
  active: true
  # v2.6.7: 让 detekt 也认识 Compose 命名约定。
  #
  # 背景：根 .editorconfig 已设 `ktlint_function_naming_ignore_when_annotated_with = Composable`，
  # 但那只对 ktlint 生效 —— detekt 不读 .editorconfig 的这条键。
  # 结果就是 600 条 @Composable 函数的 PascalCase 被 FunctionNaming 判违规，
  # 长期挂在基线里当噪音（既不是真问题，又掩盖了真问题）。
  #
  # 这是补全工具链一致性，不是放宽规则：普通函数仍要求小驼峰，
  # 只有带 @Composable 注解的组合函数按 Compose 约定允许 PascalCase。
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'

exceptions:
  active: true

empty-blocks:
  active: true
