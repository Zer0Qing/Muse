# Robolectric 全局配置。
#
# conscryptMode=OFF: 只用 BouncyCastle,不安装 Conscrypt 作为默认安全提供者。
# 原因:测试 JVM 是共享的,Robolectric 安装 Conscrypt 后会污染普通 JUnit 加密测试
# (BackupCrypto / WebServerAuthPolicy / CloudBackupReadBack 等),表现为
# javax.crypto.JarVerifier 初始化失败:
#   SecurityException: Framework jar verification can not be initialized
#   caused by conscrypt ASN.1 DIGEST_AND_KEY_TYPE_NOT_SUPPORTED
# OFF 模式更接近真机 android 的安全提供者行为,且不影响 Robolectric 自身功能。
conscryptMode=OFF
