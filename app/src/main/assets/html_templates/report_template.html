<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root {
  --bg: #f4f1e9;
  --paper: #fffaf0;
  --ink: #0d0d0c;
  --text-secondary: #4d4a45;
  --line: #d7d4ce;
  --brand: #2A7A55;
  --brand-light: #4A9F70;
  --radius-xl: 28px;
  --radius-lg: 20px;
  --shadow: 0 26px 70px rgba(34, 28, 20, .10);
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --sans: "Noto Sans SC", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121210;
    --paper: #1c1c18;
    --ink: #ece9e0;
    --text-secondary: #a8a49a;
    --line: #33332c;
    --brand: #4A9F70;
    --brand-light: #6DB88F;
    --shadow: 0 26px 70px rgba(0, 0, 0, .45);
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.75;
  padding: 48px 20px 80px;
}
.page {
  max-width: 880px;
  margin: 0 auto;
  background: var(--paper);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow);
  overflow: hidden;
  padding: 0 56px 56px;
}
.cover { width: 100%; height: 240px; object-fit: cover; display: block; }
header { padding: 40px 0 8px; }
h1 {
  font-family: var(--serif);
  font-size: 2.2em;
  line-height: 1.25;
  letter-spacing: .02em;
}
.subtitle { color: var(--text-secondary); margin-top: 12px; font-size: 1.05em; }
.meta { color: var(--text-secondary); font-size: .85em; margin-top: 16px; }
.rule { border: none; border-top: 1px solid var(--line); margin: 32px 0; }
section { margin: 40px 0; }
.section-label {
  font-family: var(--serif);
  font-size: .8em;
  letter-spacing: .12em;
  color: var(--brand);
  text-transform: uppercase;
  margin-bottom: 8px;
}
h2 { font-family: var(--serif); font-size: 1.5em; margin-bottom: 14px; }
h3 { font-family: var(--serif); font-size: 1.15em; margin: 22px 0 10px; }
p { margin: 12px 0; }
ul, ol { margin: 12px 0 12px 24px; }
li { margin: 6px 0; }
table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: .95em;
}
th, td { border: 1px solid var(--line); padding: 10px 14px; text-align: left; }
th { background: rgba(42, 122, 85, .08); font-weight: 600; }
code {
  font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  font-size: .9em;
  background: rgba(42, 122, 85, .08);
  border-radius: 6px;
  padding: 2px 6px;
}
pre {
  background: #171712;
  color: #e8e6dd;
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  overflow-x: auto;
  margin: 16px 0;
  font-size: .9em;
  line-height: 1.6;
}
blockquote {
  border-left: 3px solid var(--brand);
  padding: 4px 0 4px 16px;
  color: var(--text-secondary);
  margin: 16px 0;
}
footer {
  margin-top: 56px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  color: var(--text-secondary);
  font-size: .82em;
  display: flex;
  justify-content: space-between;
}
.brand-mark { color: var(--brand); font-weight: 700; }
</style>
</head>
<body>
<div class="page">
  {{cover_html}}
  <header>
    <h1>{{title}}</h1>
    {{subtitle_html}}
    <div class="meta">{{date}}</div>
  </header>
  <hr class="rule">
  {{sections_html}}
  <footer>
    <span>Muse 报告模板 · {{date}}</span>
    <span class="brand-mark">✦ Muse</span>
  </footer>
</div>
</body>
</html>
