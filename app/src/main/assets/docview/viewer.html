<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 预览</title>
<style>
  html, body { margin: 0; padding: 0; background: #1b1b1f; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; }
  canvas { max-width: 100%; height: auto; border-radius: 8px; background: #fff; }
  #hint { color: #9a9aa2; font-family: sans-serif; font-size: 13px; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="hint">正在等待文档数据…</div>
<div id="pages"></div>
<script src="pdf.min.js"></script>
<script>
  // v2.0.1: MUSE 文档预览底座 — 由宿主 WebView 注入 base64 数据后调用 window.renderPdf(base64)。
  // pdf.js legacy (UMD) 3.11.174，离线随包分发。
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
  }

  window.renderPdf = async function (b64) {
    try {
      const hint = document.getElementById('hint');
      const raw = atob(b64);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      const pagesEl = document.getElementById('pages');
      pagesEl.innerHTML = '';
      const limit = Math.min(pdf.numPages, 20); // 骨架：先渲染前 20 页
      for (let n = 1; n <= limit; n++) {
        const page = await pdf.getPage(n);
        const viewport = page.getViewport({ scale: 1.8 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        pagesEl.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      }
      hint.style.display = 'none';
    } catch (e) {
      document.getElementById('hint').textContent = '文档渲染失败：' + (e && e.message ? e.message : e);
    }
  };
</script>
</body>
</html>
